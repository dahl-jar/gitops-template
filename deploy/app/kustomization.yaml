apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../modules/app/base

components:
  - ../../versions/app

configMapGenerator:
  - name: app-config
    namespace: app
    envs:
      - variables.env
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: app
