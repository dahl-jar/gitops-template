service: example-api
environment: dev
namespace: example-dev
# change this: Parameter Store paths of the dev settings and secrets
paths:
- /gitops/example-api/shared
- /gitops/example-api/dev
configKeys:
- APP_BASE_URL
- APP_CORS_ALLOWED_ORIGINS
- DB_HOST
- DB_NAME
- DB_PORT
- DB_USERNAME
- SERVER_PORT
secrets:
  example-app:
    keys:
    - DB_PASSWORD
  example-db:
    keys:
    - POSTGRES_DB
    - POSTGRES_PASSWORD: DB_PASSWORD
    - POSTGRES_USER
