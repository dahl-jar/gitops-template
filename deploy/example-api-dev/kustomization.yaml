apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: example-dev

resources:
- ../../modules/example-api/base
- networkpolicy.yaml
- sealedsecrets
- frontend/serviceaccount.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- frontend/ingress.yaml
- frontend/networkpolicy.yaml

components:
- ../../versions/example-api-dev

configMapGenerator:
- name: example-config
  envs:
  - variables.env
  options:
    labels:
      app.kubernetes.io/part-of: example

patches:
- target:
    kind: Namespace
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: example
- path: patches/ci-node.yaml
  target:
    kind: Deployment
- path: patches/ci-node.yaml
  target:
    kind: StatefulSet
- target:
    kind: StatefulSet
    name: postgres
  patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 2Gi
