apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-traefik-to-frontend
  namespace: example-dev
  labels:
    app.kubernetes.io/part-of: example
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-frontend-to-app
  namespace: example-dev
  labels:
    app.kubernetes.io/part-of: example
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: example-api
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-frontend-to-app
  namespace: example-dev
  labels:
    app.kubernetes.io/part-of: example
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: example-web
      ports:
        - { protocol: TCP, port: 8080 }
