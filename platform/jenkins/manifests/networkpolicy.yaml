apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-agents-to-controller
  namespace: jenkins
  labels:
    app.kubernetes.io/name: ingress-agents-to-controller
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-builds
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-build
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 50000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-controller-kube-api
  namespace: jenkins
  labels:
    app.kubernetes.io/name: egress-controller-kube-api
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            # change this: the cluster IP of the Kubernetes API
            cidr: 10.43.0.1/32
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock:
            # change this: the node address of the Kubernetes API
            cidr: 192.0.2.10/32
      ports:
        - { protocol: TCP, port: 6443 }
---
