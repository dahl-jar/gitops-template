apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trivy-cache
  namespace: ci-builds
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: trivy-cache
    app.kubernetes.io/component: agents
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 2Gi
