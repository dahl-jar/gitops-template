apiVersion: v1
kind: Secret
metadata:
  name: jenkins-admin
  namespace: jenkins
type: Opaque
stringData:
  # change this: the admin user name, which seal-secrets.sh reads from VALUES_DIR/jenkins-admin/jenkins-admin-user
  jenkins-admin-user: CHANGE_ME
  # change this: the admin password, which seal-secrets.sh reads from VALUES_DIR/jenkins-admin/jenkins-admin-password
  jenkins-admin-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-app
  namespace: jenkins
type: Opaque
stringData:
  # change this: the id of the GitHub App, which seal-secrets.sh reads from VALUES_DIR/jenkins-github-app/app-id
  app-id: CHANGE_ME
  # change this: the private key of the GitHub App, PKCS#8 PEM, which seal-secrets.sh reads from VALUES_DIR/jenkins-github-app/private-key
  private-key: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-gitops-deploy
  namespace: jenkins
type: Opaque
stringData:
  # change this: the SSH deploy key with write access to the GitOps repo, which seal-secrets.sh reads from VALUES_DIR/jenkins-gitops-deploy/private-key
  private-key: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-cloudflare-pages
  namespace: jenkins
type: Opaque
stringData:
  # change this: the Cloudflare API token for Pages, which seal-secrets.sh reads from VALUES_DIR/jenkins-cloudflare-pages/api-token
  api-token: CHANGE_ME
  # change this: the Cloudflare account id, which seal-secrets.sh reads from VALUES_DIR/jenkins-cloudflare-pages/account-id
  account-id: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-chat-webhook
  namespace: jenkins
type: Opaque
stringData:
  # change this: the webhook address for chat alerts, which seal-secrets.sh reads from VALUES_DIR/jenkins-chat-webhook/url
  url: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-github-hook-token
  namespace: jenkins
type: Opaque
stringData:
  # change this: the token the hook listener sends to Jenkins, which seal-secrets.sh reads from VALUES_DIR/jenkins-github-hook-token/token
  token: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-oidc-signing-key
  namespace: jenkins
type: Opaque
stringData:
  # change this: the key that create-oidc-signing-key.sh generates and seals from its own VALUES_DIR/jenkins-oidc-signing-key/private-key
  private-key: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-tls
  namespace: jenkins
type: kubernetes.io/tls
stringData:
  # change this: the certificate for the Jenkins host, which seal-secrets.sh reads from VALUES_DIR/jenkins-tls/tls.crt
  tls.crt: CHANGE_ME
  # change this: the key of that certificate, which seal-secrets.sh reads from VALUES_DIR/jenkins-tls/tls.key
  tls.key: CHANGE_ME
