apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: ci-builds
  labels:
    app.kubernetes.io/name: jenkins-agent
    app.kubernetes.io/component: agents
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agents
  namespace: ci-builds
  labels:
    app.kubernetes.io/name: jenkins-agents
    app.kubernetes.io/component: agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agents
  namespace: ci-builds
  labels:
    app.kubernetes.io/name: jenkins-agents
    app.kubernetes.io/component: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agents
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
