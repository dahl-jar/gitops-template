                  }
                }
                stage('GitHub App') {
                  container('tools') {
                    withCredentials([usernamePassword(credentialsId: 'github-app', usernameVariable: 'GITHUB_APP_ID', passwordVariable: 'GITHUB_TOKEN')]) {
                      sh 'curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/installation/repositories | jq -r ".total_count, .repositories[].full_name"'
                    }
                  }
                }
                stage('OIDC token') {
                  container('tools') {
                    for (String credential : ['aws-infra', 'aws-config-read', 'aws-image-signing', 'aws-image-push', 'aws-image-pull', 'aws-dependency-fetch']) {
                      withCredentials([file(credentialsId: credential, variable: 'AWS_WEB_IDENTITY_TOKEN_FILE')]) {
                        def token = sh(returnStdout: true, script: 'P=$(cut -d. -f2 "$AWS_WEB_IDENTITY_TOKEN_FILE" | tr _- /+); while [ $(( $(printf %s "$P" | wc -c) % 4 )) -ne 0 ]; do P="$P="; done; printf %s "$P" | base64 -d | jq -c "{iss, aud, sub, build_number, lifetime: (.exp - .iat)}"').trim()
                        echo credential + ' ' + token
                        def claims = readJSON(text: token, returnPojo: true)
                        def audienceOk = claims.aud == credential || claims.aud == [credential]
                        // change this: the OIDC issuer address
                        if (claims.iss != 'https://gitops-jenkins-oidc-123456789012.s3.eu-west-1.amazonaws.com/jenkins' || !audienceOk || claims.sub != 'smoke' || claims.build_number != currentBuild.number || claims.lifetime > 900) {
                          error(credential + ' token has unexpected claims: ' + token)
                        }
                      }
                    }
                  }
                }
              }''')
                    sandbox(true)
                  }
                }
              }
  initScripts:
    "-oidc-signing-key": |
      import com.cloudbees.plugins.credentials.SystemCredentialsProvider
      import com.cloudbees.plugins.credentials.domains.Domain
      import io.jenkins.plugins.oidc_provider.IdTokenFileCredentials
      import java.security.KeyFactory
      import java.security.MessageDigest
      import java.security.interfaces.RSAPrivateCrtKey
      import java.security.spec.PKCS8EncodedKeySpec
      import java.util.logging.Logger
      import jenkins.model.Jenkins

      def titles = ['aws-infra': 'AWS Terraform', 'aws-config-read': 'AWS config read', 'aws-image-signing': 'AWS image signing', 'aws-image-push': 'AWS image push', 'aws-image-pull': 'AWS image pull', 'aws-dependency-fetch': 'AWS dependency fetch']
      def keyFile = new File('/run/secrets/additional/jenkins-oidc-signing-key-private-key')
      def log = Logger.getLogger('init-oidc-signing-key')
      def store = SystemCredentialsProvider.getInstance().getStore()
      def declared = [:]
      titles.each { credentialId, title ->
        def generated = store.getCredentials(Domain.global()).find { it instanceof IdTokenFileCredentials && it.id == credentialId }
        if (generated == null) {
          log.severe("${title}: credential ${credentialId} is missing after JCasC, builds fail until JCasC declares it")
        } else {
          declared[credentialId] = generated
        }
      }
      def remove = { credentialId, reason ->
        store.removeCredentials(Domain.global(), declared[credentialId])
        log.severe("${titles[credentialId]}: removed ${credentialId}, ${reason}")
      }

      if (declared.isEmpty()) {
        return
      }
      if (!keyFile.isFile()) {
        declared.keySet().each { remove(it, "signing key file ${keyFile} is missing") }
        return
      }
      def encoded
      try {
        encoded = keyFile.text.trim()
        def privateKey = (RSAPrivateCrtKey) KeyFactory.getInstance('RSA').generatePrivate(new PKCS8EncodedKeySpec(Base64.decoder.decode(encoded)))
        def modulus = privateKey.modulus.toByteArray()
        def unsigned = modulus[0] == 0 ? Arrays.copyOfRange(modulus, 1, modulus.length) : modulus
        def n = Base64.urlEncoder.withoutPadding().encodeToString(unsigned)
        def fingerprint = MessageDigest.getInstance('SHA-256').digest(n.getBytes('US-ASCII')).encodeHex().toString()
        log.info("read the signing key, sha256 of n is ${fingerprint}")
      } catch (Exception failure) {
        declared.keySet().each { remove(it, "the signing key did not restore: ${failure.class.name}") }
        return
      }
      declared.each { credentialId, generated ->
        try {
          def xml = """<io.jenkins.plugins.oidc__provider.IdTokenFileCredentials>
        <scope>GLOBAL</scope>
        <id>${credentialId}</id>
        <description>${generated.description}</description>
        <privateKey>${encoded}</privateKey>
        <issuer>${generated.issuer}</issuer>
        <audience>${generated.audience}</audience>
      </io.jenkins.plugins.oidc__provider.IdTokenFileCredentials>"""
          store.updateCredentials(Domain.global(), generated, Jenkins.XSTREAM2.fromXML(xml))
          log.info("${titles[credentialId]}: restored the signing key into ${credentialId}")
        } catch (Exception failure) {
          remove(credentialId, "the credential store did not take the restored key: ${failure.class.name}")
        }
      }
