                          genericVariable { key('SHA'); value('$.sha'); expressionType('JSONPath'); regexpFilter(''); defaultValue('') }
                          genericVariable { key('KIND'); value('$.kind'); expressionType('JSONPath'); regexpFilter(''); defaultValue('') }
                        }
                        token('')
                        tokenCredentialId('github-hook-token')
                        regexpFilterText('$REPO $SENDER $REF $SHA $KIND')
                        // change this: the GitOps repo, its IAM role id and the role id of the app repos
                        regexpFilterExpression('^(your-org/gitops AROAEXAMPLE0000000001|(?!your-org/gitops )[A-Za-z0-9-]+/[A-Za-z0-9._-]+ AROAEXAMPLE0000000002) refs/(heads/[A-Za-z0-9._/-]+ [0-9a-f]{40} (test|deploy)?|tags/v[0-9]+\\.[0-9]+\\.[0-9]+ [0-9a-f]{40} (deploy)?)\\z')
                        causeString('Request for $REPO $REF $KIND')
