apiVersion: v1
kind: Secret
metadata:
  name: hook-listener
  namespace: jenkins-hook
type: Opaque
stringData:
  # change this: the client certificate for IAM Roles Anywhere, the first argument of seal-secrets.sh
  tls.crt: CHANGE_ME
  # change this: the key of that certificate, the second argument of seal-secrets.sh
  tls.key: CHANGE_ME
  # change this: the same token as jenkins-github-hook-token, the third argument of seal-secrets.sh
  trigger-token: CHANGE_ME
