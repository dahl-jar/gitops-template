apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-dev-cluster
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  project: default
  source:
    # change this: SSH URL of the GitOps repo
    repoURL: git@github.com:your-org/gitops.git
    targetRevision: prod
    path: platform/example-dev-cluster
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
