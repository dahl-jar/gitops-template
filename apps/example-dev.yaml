apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops
spec:
  project: example-dev
  source:
    # change this: SSH URL of the GitOps repo
    repoURL: git@github.com:your-org/gitops.git
    targetRevision: dev
    path: deploy/example-api-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: example-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - FailOnSharedResource=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
