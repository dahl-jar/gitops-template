apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-hook
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ci
  source:
    # change this: SSH URL of the GitOps repo
    repoURL: git@github.com:your-org/gitops.git
    targetRevision: prod
    path: platform/jenkins-hook
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
