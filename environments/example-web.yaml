service: example-web
# change this: GitHub repo of the app, as org/name
repo: your-org/example-web
# change this: test runner of the app repo, gradle or pnpm
testSuite: pnpm
environments:
  production:
    # change this: branch of the app repo that a release is built from
    releaseFrom: main
    target: cloudflare-pages
    versionFile: versions/example-web/version.yaml
    buildEnv:
      # change this: public URL of the API, built into the production site
      VITE_API_BASE_URL: https://api.example.com
  dev:
    # change this: branches of the app repo that deploy to dev
    branches: [main]
    target: cluster
    # change this: image path with the AWS account id and region
    image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-web
    versions: versions/example-api-dev
    overlay: deploy/example-api-dev
    buildArgs:
      # change this: URL of the dev host, built into the dev image
      VITE_API_BASE_URL: http://example-dev.home.arpa
