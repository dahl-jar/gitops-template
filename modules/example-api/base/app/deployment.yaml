apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: example
  labels:
    app.kubernetes.io/name: example-api
    app.kubernetes.io/part-of: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-api
        app.kubernetes.io/part-of: example
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: example-api
          # change this: image path with the AWS account id and region
          image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/example-api
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: example-config
            - secretRef:
                name: example-app
          # change this: memory the app needs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              # change this: health path of the app
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
